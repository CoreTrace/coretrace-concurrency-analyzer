name: Install LLVM 20 from apt.llvm.org
description: >-
  Installs the LLVM 20 toolchain and the build tools on an Ubuntu runner with
  the same bounded download policy the container builds use, so a transient
  apt.llvm.org failure is retried and a persistent one fails the job with the
  reason in the log. Requires the repository to be checked out first.

runs:
  using: composite
  steps:
    - name: Install LLVM 20 and build tools
      shell: bash
      run: |
        sudo tee -a /etc/wgetrc < docker/wgetrc > /dev/null
        wget -nv https://apt.llvm.org/llvm.sh
        chmod +x llvm.sh
        sudo ./llvm.sh 20
        sudo apt-get update
        sudo apt-get install -y clang-20 llvm-20-dev libclang-20-dev cmake ninja-build
